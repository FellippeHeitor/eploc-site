name: Usuários da Web Store

# Atualiza _data/webstore.json com o número de usuários da Chrome Web Store
# (arredondado para baixo) e publica o resultado quando ele muda.
on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: [scripts/fetch-users.mjs]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: users
  cancel-in-progress: false

jobs:
  users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/fetch-users.mjs

      - name: Commit e publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add _data/webstore.json
          if git diff --cached --quiet; then
            echo "Número de usuários não mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza número de usuários da Web Store"
          git pull --rebase
          git push
          # Pushes feitos com o GITHUB_TOKEN podem não disparar o build do Pages
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
