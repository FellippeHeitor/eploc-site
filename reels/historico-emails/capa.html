<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: Histórico de e-mails</title>
<!--
  Capa do reel (1080x1920), com o conteúdo centrado no recorte 4:5 do perfil do Instagram.
  Gerada por: node reels/render.mjs historico-emails capa.png --capa
-->
<link rel="stylesheet" href="../base/reel.css">
<style>
.blob--a { width: 420px; height: 420px; left: -160px; top: 60px; opacity: .6; }
.blob--b { width: 380px; height: 380px; right: -160px; top: 520px; bottom: auto; opacity: .6; }
.conteudo { position: absolute; left: 40px; right: 40px; top: 262px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.kicker { padding: 4px 12px; border-radius: 999px; background: var(--pink); color: #fff; font-weight: 600; font-size: 14px; }
h1 { margin-top: 14px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 50px; line-height: .98; letter-spacing: -.5px; }
h1 em { font-style: normal; color: var(--pink); }
.sub { margin-top: 12px; font-size: 17px; color: var(--ink-muted); }
.cartao { margin-top: 26px; width: 440px; border-radius: 14px; background: #fff; padding: 14px; text-align: left;
  box-shadow: 0 1px 2px rgba(34,24,39,.05), 0 18px 40px -18px rgba(34,24,39,.35); }
.cartao label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
.fieldbox { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid #4a90d9; box-shadow: 0 0 0 1px #4a90d9; border-radius: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px 3px 12px; border: 1px solid; border-radius: 16px; font-size: 16px; }
.fchip span { color: #6b7280; font-size: 16px; padding: 0 3px; }
.marca { margin-top: 30px; display: flex; align-items: center; gap: 12px; }
.marca img { width: 64px; height: 64px; }
.marca div { text-align: left; font-weight: 600; font-size: 16px; line-height: 1.3; }
.marca span { display: block; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; color: var(--pink); }
</style>
</head>
<body>
<div class="blob blob--a"></div>
<div class="blob blob--b"></div>
<div class="conteudo">
  <span class="kicker">E-mail pelo eproc</span>
  <h1>Cole um texto,<br>ganhe os <em>destinatários</em></h1>
  <p class="sub">Chips, autocompletar e quem costuma ir junto.</p>
  <div class="cartao">
    <label>Para:</label>
    <div class="fieldbox" id="chips"></div>
  </div>
  <div class="marca">
    <img src="../../assets/eploc-logo-sem-texto-1000.png" alt="">
    <div>eploc · grátis para Chrome e Edge<span>eploc.com.br</span></div>
  </div>
</div>
<script>
// Mesmas cores do reel (matiz pelo hash do endereço, como na extensão).
function matiz(t) { let h = 0x811c9dc5; for (const c of t.trim().toLowerCase()) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h % 360; }
document.getElementById('chips').innerHTML = [
  ['Maria Souza', 'maria.souza@exemplo.com.br'], ['cartorio.2vara@exemplo.com.br', 'cartorio.2vara@exemplo.com.br'],
  ['Carlos Lima', 'carlos.lima@adv.exemplo.com.br'], ['João Pereira', 'joao.pereira@exemplo.com.br'], ['Ana Ribeiro', 'ana.ribeiro@exemplo.com.br'],
].map(([r, e]) => { const m = matiz(e); return `<span class="fchip" style="background:hsl(${m} 65% 93%);border-color:hsl(${m} 45% 74%);color:hsl(${m} 60% 24%)">${r}<span>×</span></span>`; }).join('');
window.pronto = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {}))));
</script>
</body>
</html>
