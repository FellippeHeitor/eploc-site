<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: Link para evento</title>
<!--
  Capa do reel (1080x1920), com o conteúdo centrado no recorte 4:5 do perfil do Instagram.
  Gerada por: node reels/render.mjs link-evento capa.png --capa
-->
<link rel="stylesheet" href="../base/reel.css">
<style>
.blob--a { width: 420px; height: 420px; left: -160px; top: 60px; opacity: .6; }
.blob--b { width: 380px; height: 380px; right: -160px; top: 520px; bottom: auto; opacity: .6; }
.conteudo { position: absolute; left: 40px; right: 40px; top: 272px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.kicker { padding: 4px 12px; border-radius: 999px; background: var(--pink); color: #fff; font-weight: 600; font-size: 14px; }
h1 { margin-top: 14px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 50px; line-height: .98; letter-spacing: -.5px; }
h1 em { font-style: normal; color: var(--pink); }
.sub { margin-top: 12px; font-size: 17px; color: var(--ink-muted); }
.cartao { margin-top: 26px; width: 420px; border-radius: 14px; background: #fff; overflow: hidden; text-align: left;
  box-shadow: 0 1px 2px rgba(34,24,39,.05), 0 18px 40px -18px rgba(34,24,39,.35); }
.linha { display: grid; grid-template-columns: 40px 1fr 60px; align-items: center; height: 46px; padding: 0 12px; font-size: 13px; color: #2f2f2f;
  border-bottom: 1px solid #e6e9ee; }
.linha:last-child { border-bottom: 0; }
.linha b { text-align: center; }
.linha span:last-child { color: #0b57b5; font-size: 12px; text-align: right; }
.ref { color: #0056b3; text-decoration: underline; font-weight: 700; position: relative; }
.ref svg { position: absolute; right: -20px; top: 10px; width: 24px; height: 24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
.pontos { height: 22px; display: grid; place-items: center; color: var(--fraco); font-size: 16px; letter-spacing: 4px; border-bottom: 1px solid #e6e9ee; }
.alvo { background: #fff3cd; outline: 2px solid #ffc107; outline-offset: -2px; }
.marca { margin-top: 30px; display: flex; align-items: center; gap: 12px; }
.marca img { width: 64px; height: 64px; }
.marca div { text-align: left; font-weight: 600; font-size: 16px; line-height: 1.3; }
.marca span { display: block; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; color: var(--pink); }
</style>
</head>
<body>
<div class="blob blob--a"></div>
<div class="blob blob--b"></div>
<div class="conteudo">
  <span class="kicker">Página do processo no eproc</span>
  <h1>“Refer. ao Evento 12”<br>vira <em>link</em></h1>
  <p class="sub">Um clique e você está no evento. Até nos PDFs.</p>
  <div class="cartao">
    <div class="linha"><b>47</b><span>PETIÇÃO - <span class="ref">Refer. ao Evento 12<svg viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.3-4.1 2.9 6.6 3-1.3-2.9-6.5h6z" fill="#fff" stroke="#1d2433" stroke-width="1.6" stroke-linejoin="round"/></svg></span></span><span>PET1</span></div>
    <div class="pontos">⋮</div>
    <div class="linha alvo"><b>12</b><span>CONTESTAÇÃO</span><span>CONT1</span></div>
  </div>
  <div class="marca">
    <img src="../../assets/eploc-logo-sem-texto-1000.png" alt="">
    <div>eploc · grátis para Chrome e Edge<span>eploc.com.br</span></div>
  </div>
</div>
<script>window.pronto = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {}))));</script>
</body>
</html>
