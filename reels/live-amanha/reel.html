<!--
  Story do Instagram (1080x1920, 15 s) anunciando a live, com a cena da tela de espera
  (live/em-instantes.html): o cursor sopra a bola de chiclete no centro do aro, ela estoura,
  o chiclete gruda na tela e o cursor sopra outra.
  Gerado por: node reels/render.mjs live-amanha saida.mp4
  O espaço em .vaga fica vazio de propósito: é onde vai o sticker de link do Instagram com o

  anel.rotation.z = Math.PI * 1.25 - arco;  // começa atrás do pescoço e fecha no sentido horário

/* ---------- Cursor (seta do mouse) ---------- */
function formaCursor(escala) {
  const pts = [[0,0],[0,16],[4,12.2],[7,18.6],[9.6,17.5],[6.7,11.3],[12,11.3]];
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => i ? s.lineTo(x * escala, -y * escala) : s.moveTo(x * escala, -y * escala));
  s.closePath();

}
const cursor = new THREE.Group();
{
  const esc = 0.044;
  const geoMiolo = new THREE.ExtrudeGeometry(formaCursor(esc), { depth: 0.08, bevelEnabled: true, bevelThickness: .03, bevelSize: .01, bevelSegments: 3 });
  const geoContorno = new THREE.ExtrudeGeometry(formaCursor(esc), { depth: 0.06, bevelEnabled: true, bevelThickness: .03, bevelSize: .075, bevelSegments: 3 });
  const miolo = new THREE.Mesh(geoMiolo, new THREE.MeshPhysicalMaterial({ color: 0xffd3e5, emissive: 0x5a1030, emissiveIntensity: .15, roughness: .3, clearcoat: 1 }));
  const contorno = new THREE.Mesh(geoContorno, new THREE.MeshPhysicalMaterial({ color: 0xd42a6c, emissive: 0x4a0520, emissiveIntensity: .5, roughness: .3, clearcoat: 1 }));
  miolo.position.z = 0.04; contorno.position.z = -0.04;
  const seta = new THREE.Group(); seta.add(contorno, miolo);
  // gira para a cauda ficar oposta à bola (ponta encostada no pescoço)
  const eixo = Math.atan2(-14.5, 6.5);
  seta.rotation.z = Math.atan2(-DIR.y, -DIR.x) - eixo;
  seta.position.set(DIR.x * 0.06, DIR.y * 0.06, -0.02);  // ponta enfiada sob o bico

logo.add(cursor);

/* Onda do clique */
const onda = new THREE.Mesh(new THREE.TorusGeometry(1, 0.025, 8, 64), new THREE.MeshBasicMaterial({ color: 0xffb3d1, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
onda.position.copy(PONTA); onda.position.z = 0.1;
logo.add(onda);

/* ---------- Estouro: lascas de chiclete ---------- */
const N_LASCAS = 180;
const lascas = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), matChiclete, N_LASCAS);
lascas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lascas.frustumCulled = false;
logo.add(lascas);
const dadosLascas = Array.from({ length: N_LASCAS }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3(), s: 0, vida: 0 }));
const choque = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 96), new THREE.MeshBasicMaterial({ color: 0xffd0e2, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
logo.add(choque);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _e = new THREE.Euler();
let lascasVivas = false;

/* Chiclete grudado na tela: parte das lascas "bate no vidro", fica parada na tela
   (o grupo vai preso à câmera), escorre um pouco e some. */
const N_GRUDE = 48, D_VIDRO = 6;
// mancha de chiclete achatada: cúpula baixa com borda irregular, voltada para a câmera
function geometriaGrude() {
  const ANEIS = 14, SEGS = 64, pos = [], idx = [];
  const borda = a => 1 + 0.1 * Math.sin(a * 3 + 1.3) + 0.06 * Math.sin(a * 5 + 0.4) + 0.03 * Math.sin(a * 9 + 2.1);
  pos.push(0, 0, 1);
  for (let i = 1; i <= ANEIS; i++) {
    const r = i / ANEIS;
    for (let j = 0; j < SEGS; j++) {
      const a = j / SEGS * Math.PI * 2, b = borda(a) * r;
      pos.push(Math.cos(a) * b, Math.sin(a) * b, Math.pow(Math.max(1 - r * r, 0), 0.55));
    }
  }
  for (let j = 0; j < SEGS; j++) idx.push(0, 1 + j, 1 + (j + 1) % SEGS);
  for (let i = 1; i < ANEIS; i++) for (let j = 0; j < SEGS; j++) {
    const a = 1 + (i - 1) * SEGS + j, b = 1 + (i - 1) * SEGS + (j + 1) % SEGS, c = a + SEGS, d = b + SEGS;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const geoGrude = geometriaGrude();
const matGrude = matChiclete.clone();
matGrude.transparent = true; matGrude.depthWrite = false;
matGrude.onBeforeCompile = sh => {
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", "#include <common>\nattribute float aAlfa;\nvarying float vAlfa;")
    .replace("#include <begin_vertex>", "#include <begin_vertex>\nvAlfa = aAlfa;");
  sh.fragmentShader = sh.fragmentShader
    .replace("#include <common>", "#include <common>\nvarying float vAlfa;")
    .replace("#include <dithering_fragment>", "#include <dithering_fragment>\ngl_FragColor.a *= vAlfa;");
};
const grudes = new THREE.InstancedMesh(geoGrude, matGrude, N_GRUDE);
const alfaGrude = new THREE.InstancedBufferAttribute(new Float32Array(N_GRUDE), 1);
alfaGrude.setUsage(THREE.DynamicDrawUsage);
grudes.geometry.setAttribute("aAlfa", alfaGrude);
grudes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
grudes.frustumCulled = false; grudes.count = 0; grudes.renderOrder = 5;
camera.add(grudes);
cena.add(camera);
const dadosGrude = [];
const _w = new THREE.Vector3();
function grudarNaTela(d, k) {
  if (dadosGrude.length >= N_GRUDE) return false;
  _w.copy(d.p); logo.localToWorld(_w);
  const dist = camera.position.distanceTo(_w);
  _w.project(camera);
  if (Math.abs(_w.x) > 0.97 || Math.abs(_w.y) > 0.95) return false;
  // não gruda por cima do texto
  const px = (_w.x + 1) / 2 * innerWidth, py = (1 - _w.y) / 2 * innerHeight;
  for (const sel of [".texto", ".selo"]) {
    const caixa = document.querySelector(sel).getBoundingClientRect();
    if (px > caixa.left - 30 && px < caixa.right + 30 && py > caixa.top - 30 && py < caixa.bottom + 30) return false;
  }
  const meiaAlt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * D_VIDRO;
  dadosGrude.push({
    x: _w.x * meiaAlt * camera.aspect, y: _w.y * meiaAlt, rot: Math.random() * 6.28,
    s: d.s * Math.max(k, .6) * logo.scale.x * (D_VIDRO / dist) * (1.5 + Math.random() * 0.7),
    sx: 0.85 + Math.random() * 0.4, idade: 0,
    fica: 2.4 + Math.random() * 2.2, escorre: 0.01 + Math.random() * 0.035,
  });
  return true;
}
function atualizarGrudes(dt) {
  let n = 0;
  for (let i = dadosGrude.length - 1; i >= 0; i--) {
    const g = dadosGrude[i];
    g.idade += dt;
    if (g.idade > g.fica + 1) dadosGrude.splice(i, 1);
  }
  for (const g of dadosGrude) {
    // achata ao bater (pequeno repique) e escorre devagar
    const impacto = Math.min(g.idade / 0.16, 1);
    const esmaga = easeOutBack(impacto);
    const yEsc = g.y - g.escorre * Math.max(g.idade - 0.3, 0) * Math.min(g.idade, 2);
    _s.set(g.s * g.sx * esmaga, g.s * (2 - esmaga * 0.95) * 0.55 + g.s * 0.45 * esmaga, g.s * 0.22);
    _m.compose(_w.set(g.x, yEsc, -D_VIDRO), _q.setFromEuler(_e.set(0, 0, g.rot)), _s);
    grudes.setMatrixAt(n, _m);
    alfaGrude.setX(n, g.idade < g.fica ? 1 : Math.max(0, 1 - (g.idade - g.fica)));
    n++;
  }
  grudes.count = n;
  grudes.instanceMatrix.needsUpdate = true;
  alfaGrude.needsUpdate = true;
}

function estourar(centro, R, forca = 1) {
  const quantasGrudam = Math.round(8 + Math.random() * 6);
  let iLasca = 0;
  for (const d of dadosLascas) {
    d.gruda = iLasca++ < quantasGrudam;
    d.idade = 0;
    d.tGruda = 0.12 + Math.random() * 0.3;
    const dirx = new THREE.Vector3().randomDirection();
    d.p.copy(centro).addScaledVector(dirx, R * (0.85 + Math.random() * .15));
    d.v.copy(dirx).multiplyScalar((3 + Math.random() * 4.5) * forca);
    d.v.z *= 0.5;
    d.q.setFromEuler(_e.set(Math.random() * 6, Math.random() * 6, Math.random() * 6));
    d.w.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(12);
    d.s = (d.gruda ? 0.08 + Math.random() * 0.06 : 0.05 + Math.random() * 0.13) * Math.sqrt(R / R_MAX + .2);
    d.vida = 1;
  }
  lascasVivas = true;
  choque.position.set(centro.x, centro.y, centro.z + .2);
  choque.userData.t = 0; choque.userData.R = R;
  empurrarBolhas(centro, 4 * forca);
}
function atualizarLascas(dt) {
  if (!lascasVivas) { lascas.count = 0; return; }
  let vivas = 0;
  for (let i = 0; i < N_LASCAS; i++) {
    const d = dadosLascas[i];
    if (d.vida > 0) {
      d.idade += dt;
      if (d.gruda && d.idade >= d.tGruda) {
        d.gruda = false;
        if (grudarNaTela(d, Math.max(d.vida, 0))) { d.vida = 0; continue; }
      }
      d.vida -= dt * 0.7;
      d.v.y -= 6.5 * dt; d.v.multiplyScalar(1 - 1.4 * dt);
      d.p.addScaledVector(d.v, dt);
      _q.setFromEuler(_e.set(d.w.x * dt, d.w.y * dt, d.w.z * dt)); d.q.multiply(_q);
      const k = Math.max(d.vida, 0);
      _s.set(d.s * k, d.s * k, d.s * k * 0.35);
      _m.compose(d.p, d.q, _s);
      lascas.setMatrixAt(vivas++, _m);
    }
  }
  lascas.count = vivas;
  lascas.instanceMatrix.needsUpdate = true;
  if (!vivas) lascasVivas = false;
  if (choque.userData.t !== undefined && choque.userData.t < 1) {
    choque.userData.t += dt * 2.2;
    const t = choque.userData.t;
    choque.scale.setScalar(choque.userData.R * (1 + t * 1.6));
    choque.material.opacity = Math.max(0, 0.8 * (1 - t));
  }
}

/* ---------- Bolhas de fundo ---------- */
const N_BOLHAS = 46;
const matBolhas = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .15, clearcoat: 1, transparent: true, opacity: .34, iridescence: .8, depthWrite: false });
const bolhas = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 24, 16), matBolhas, N_BOLHAS);
bolhas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bolhas.frustumCulled = false;
const paleta = [0xff7fb2, 0xff9cc4, 0x8cc6f2, 0xb8dcf7, 0xffffff];
const dadosBolhas = Array.from({ length: N_BOLHAS }, (_, i) => {
  bolhas.setColorAt(i, new THREE.Color(paleta[i % paleta.length]));
  return {};
});
function sortearBolhas() {
  for (const b of dadosBolhas) Object.assign(b, { x: (Math.random() - .5) * 12, y: (Math.random() - .5) * 18, z: -3 - Math.random() * 12, r: .08 + Math.random() * .32, vel: .25 + Math.random() * .45, fase: Math.random() * 6.28, ex: 0, ey: 0 });
}
cena.add(bolhas);
function empurrarBolhas(centro, forca) {
  const c = centro.clone(); logo.localToWorld(c);
  for (const b of dadosBolhas) {
    const dx = b.x - c.x, dy = b.y - c.y, dist = Math.hypot(dx, dy) + 1;
    b.ex += dx / dist * forca / dist * 3; b.ey += dy / dist * forca / dist * 3;
  }
}
function atualizarBolhas(t, dt) {
  for (let i = 0; i < N_BOLHAS; i++) {
    const b = dadosBolhas[i];
    b.y += b.vel * dt * (reduzido ? .3 : 1);
    b.x += b.ex * dt; b.y += b.ey * dt;
    b.ex *= 1 - 1.6 * dt; b.ey *= 1 - 1.6 * dt;
    if (b.y > 9) { b.y = -9; b.x = (Math.random() - .5) * 12; }
    _m.compose(_s.set(b.x + Math.sin(t * .6 + b.fase) * .4, b.y, b.z), _q.identity(), new THREE.Vector3(b.r, b.r, b.r));
    bolhas.setMatrixAt(i, _m);
  }
  bolhas.instanceMatrix.needsUpdate = true;
}


/* ---------- Posição da logo no story ---------- */
camera.aspect = 540 / 960; camera.updateProjectionMatrix();
renderer.setSize(540, 960, false);
const altVis = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
const porPx = altVis / 960;
const ESCALA = 0.47;
logo.scale.setScalar(ESCALA);
// centro do aro em (282, 282) da página
logo.position.set((282 - 270) * porPx - CENTRO.x * ESCALA, (480 - 282) * porPx - CENTRO.y * ESCALA, 0);

/* ---------- Linha do tempo (15 s) ---------- */
// 0–1,0 cursor entra até o centro do aro · 1,1 clique · 1,3–3,3 sopro · aro se desenha 1,9–3,5
// 9,3 incha demais · 10,2 estoura (chiclete gruda) · 11,2–12,4 cursor volta · 12,6 clique · 12,8–14,8 sopro
const T = { entraFim: 1.0, sopros: [{ clique: 1.1, ini: 1.3, fim: 3.3 }, { clique: 12.6, ini: 12.8, fim: 14.8 }],
  incharIni: 9.3, estouro: 10.2, voltaIni: 11.2, voltaFim: 12.4 };
const easeOutBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const prog = (t, a, b) => Math.min(Math.max((t - a) / (b - a), 0), 1);
const H_MIN = 0.08;
const PONTA_INICIAL = new THREE.Vector3(CENTRO.x - DIR.x * H_MIN, CENTRO.y - DIR.y * H_MIN, 0);
const pontaAtual = new THREE.Vector3();
const centroAtual = new THREE.Vector3();

function sopro(t, s) {
  // ~2 s: começa devagar, ganha ritmo, com leves pulsos; no fim, uma pequena acomodação
  if (t < s.ini) return 0;
  if (t > s.fim) { const d = t - s.fim; return 1 + 0.045 * Math.exp(-d * 4.5) * Math.sin(d * 13); }
  const k = (t - s.ini) / (s.fim - s.ini);
  return easeInOut(k) * 0.94 + k * 0.06 + 0.025 * Math.sin(k * Math.PI * 5) * Math.sin(k * Math.PI);
}
const pontaDe = (c) => {
  const h = H_MIN + 0.7 * R_MAX * Math.min(c, 1.05) + R_MAX * c;
  return new THREE.Vector3(CENTRO.x - DIR.x * h, CENTRO.y - DIR.y * h, 0);
};

function cenaEm(t) {
  const segunda = t >= T.estouro;
  const s = T.sopros[segunda ? 1 : 0];
  const c = sopro(t, s);

  // ponta do cursor
  if (t < T.entraFim) {
    const k = easeInOut(t / T.entraFim);
    pontaAtual.lerpVectors(new THREE.Vector3(PONTA.x - 7, PONTA.y + 1.5, 0), PONTA_INICIAL, k);   // entra pela esquerda, acima do texto
    pontaAtual.y -= Math.sin(k * Math.PI) * 0.8;
  } else if (!segunda || t >= s.clique) {
    pontaAtual.copy(t < s.ini ? PONTA_INICIAL : pontaDe(c));
  } else {
    const k = easeInOut(prog(t, T.voltaIni, T.voltaFim));
    pontaAtual.lerpVectors(pontaDe(1), PONTA_INICIAL, k);
    pontaAtual.x += Math.sin(k * Math.PI) * 0.35;
    pontaAtual.y -= Math.sin(k * Math.PI) * 0.35;
  }
  const dc = t - s.clique;
  const kClique = dc >= 0 && dc < 0.35 ? Math.sin(dc / 0.35 * Math.PI) : 0;
  cursor.position.set(pontaAtual.x, pontaAtual.y, -kClique * .25);
  cursor.scale.setScalar(1 - kClique * 0.14);
  onda.position.set(pontaAtual.x, pontaAtual.y, 0.1);
  onda.material.opacity = dc >= 0 && dc < 0.9 ? 0.9 * (1 - dc / 0.9) : 0;
  onda.scale.setScalar(0.1 + Math.max(dc, 0) * 1.2);

  // bola
  const inchar = !segunda && t > T.incharIni ? Math.pow(prog(t, T.incharIni, T.estouro), 2) : 0;
  const respira = 1 + Math.sin(t * 1.7) * 0.018;
  const R = Math.max(0.02, R_MAX * c * respira * (1 + inchar * 0.22));
  const L = H_MIN + 0.7 * R_MAX * Math.min(c, 1.05);
  const tremor = inchar > 0 ? Math.sin(t * 60) * inchar * 0.015 : 0;
  const oscila = .014 + (1 - Math.min(Math.max(t - s.ini, 0) / 3.1, 1)) * 0.05 + inchar * 0.05;
  moldarBola(R * (1 + tremor), L, t, oscila, 0.07 + Math.sin(t * .9) * .025);
  suporteBola.position.set(pontaAtual.x, pontaAtual.y, 0);
  const estourada = !segunda ? false : t < s.ini;
  bola.visible = !estourada && c > 0.001;
  const h = L + R;
  centroAtual.set(pontaAtual.x + DIR.x * h, pontaAtual.y + DIR.y * h, 0);

  const kE = smooth(0.45, 0.85, c);
  spriteE.visible = bola.visible && kE > 0;
  spriteE.position.set(centroAtual.x - R * .06, centroAtual.y - R * .02, R * 1.02);
  spriteE.scale.setScalar(R * 1.55 * (0.6 + 0.4 * kE));
  matE.opacity = kE;
  matE.rotation = Math.sin(t * 1.3) * 0.04;

  brilho.position.set(centroAtual.x, centroAtual.y, -1.2);
  brilho.scale.setScalar(R * 4.2 + 0.3);
  brilho.material.opacity = bola.visible ? 0.9 : Math.max(0, 0.9 - (t - T.estouro) * 2);

  // aro: desenha uma vez no primeiro sopro
  const kA = prog(t, 1.9, 3.5);
  anel.visible = kA > 0;
  desenharAnel(easeInOut(kA));

  suporteAnel.scale.setScalar(1 + pulsoAnel + inchar * 0.03);
  suporteAnel.rotation.x = Math.sin(t * .45) * .2;
  suporteAnel.rotation.y = Math.cos(t * .37) * .18;

  camera.position.x = Math.sin(t * .17) * .25;
  camera.position.y = Math.cos(t * .13) * .15;
  camera.lookAt(0, 0, 0);
  logo.rotation.y = Math.sin(t * .25) * .12;
  logo.rotation.x = Math.cos(t * .21) * .06;
}

/* ---------- Texto: entra escalonado no começo ---------- */
const $ = (id) => document.getElementById(id);
function entra(el, t, t0, sobe = 16) {
  const k = easeOut(prog(t, t0, t0 + 0.45));
  el.style.opacity = String(k);
  el.style.transform = `translateY(${(1 - k) * sobe}px)`;
}
function texto(t) {
  entra($("selo"), t, 0.15); $("selo").style.transform += " translateX(-50%)";
  $("ponto").style.boxShadow = `0 0 0 ${((t * 0.55) % 1) * 9}px rgba(255,111,168,${0.7 * (1 - (t * 0.55) % 1)})`;
  entra($("l1"), t, 0.4);
  const k2 = prog(t, 0.65, 1.15);
  $("l2").style.opacity = String(Math.min(k2 * 2, 1));
  $("l2").style.transform = `scale(${0.7 + 0.3 * easeOutBack(k2)})`;
  entra($("data"), t, 1.0);
  entra($("sub"), t, 1.2);
  entra($("grupo"), t, 1.6, 22);
  // setas descem em sequência; halo da vaga pulsa
  [...$("setas").children].forEach((el, i) => { el.style.opacity = String(0.25 + 0.75 * Math.max(0, Math.sin((t * 2.2 - i * 0.35) * Math.PI)) ** 2); });
  $("halo").style.opacity = String(0.55 + 0.45 * Math.sin(t * 3));
}

/* ---------- Simulação determinística ---------- */
let tSim = -1;
function reiniciar() {
  semente = 1;
  sortearBolhas();
  for (const d of dadosLascas) d.vida = 0;
  lascasVivas = false; lascas.count = 0;
  dadosGrude.length = 0; grudes.count = 0;
  choque.userData.t = 1; choque.material.opacity = 0;
  tSim = 0;
}
function renderFrame(t) {
  if (t < tSim || tSim < 0) reiniciar();
  while (tSim < t - 1e-9) {
    const dt = Math.min(1 / 60, t - tSim);
    if (tSim < T.estouro && tSim + dt >= T.estouro) {
      cenaEm(T.estouro - 1e-4);
      estourar(centroAtual.clone(), R_MAX * 1.2);
    }
    tSim += dt;
    atualizarLascas(dt);
    atualizarGrudes(dt);
    atualizarBolhas(tSim, dt);
  }
  cenaEm(t);
  texto(t);
  renderer.render(cena, camera);
}
window.renderFrame = renderFrame;

await document.fonts.ready;
renderFrame(0);
window.__pronto();

// Aberto no navegador (sem ?render): toca em loop.
if (!location.search.includes("render")) {
  const ini = performance.now();
  const laco = () => { renderFrame(((performance.now() - ini) / 1000) % window.DURACAO); requestAnimationFrame(laco); };
  requestAnimationFrame(laco);
}
