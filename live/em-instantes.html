<style>
  /* Layout: cena 3D em tela cheia; texto à direita no 16:9 e embaixo em telas estreitas. */
  :root {
    --fundo-1: #170c26;
    --fundo-2: #0b1432;
    --rosa: #ff6fa8;
    --rosa-claro: #ffc2da;
    --azul: #8cc6f2;
    --texto: #fff5fa;
    --texto-suave: #c9b9d6;
    --chip: rgba(255, 255, 255, 0.07);
    --chip-borda: rgba(255, 255, 255, 0.14);
    --f-titulo: "Baloo 2", "Nunito", system-ui, sans-serif;

    color-scheme: dark;

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(60% 70% at 30% 45%, rgba(210, 58, 113, 0.28), transparent 70%),
      radial-gradient(50% 60% at 80% 80%, rgba(31, 95, 209, 0.25), transparent 70%),
      linear-gradient(160deg, var(--fundo-1), var(--fundo-2));
    color: var(--texto);
    font-family: var(--f-texto);
  }
  body.transparente { background: transparent; }
  canvas#cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .palco {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 52% 1fr;
    align-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    pointer-events: none;
  }
  .texto { grid-column: 2; display: flex; flex-direction: column; gap: 1.2vmin; max-width: 44rem; min-width: 0; }
  .selo {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: .7em;
    font: 800 clamp(11px, 1.35vmin, 18px)/1 var(--f-texto);
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--rosa-claro);
    padding: .75em 1.1em; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--chip-borda);

  .selo i { width: .7em; height: .7em; border-radius: 50%; background: var(--rosa); box-shadow: 0 0 0 0 var(--rosa); animation: pulso 1.8s ease-out infinite; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(255,111,168,.7);} 100% { box-shadow: 0 0 0 1.1em rgba(255,111,168,0);} }

  h1 {
    margin: 1vmin 0 0;
    font: 800 clamp(44px, 11vmin, 168px)/.95 var(--f-titulo);
    letter-spacing: -.01em;

  h1 .pontos span:nth-child(3) { animation-delay: .3s; }
  @keyframes quica { 0%, 60%, 100% { transform: translateY(0);} 30% { transform: translateY(-.18em);} }

  .sub { margin: 0; font: 700 clamp(16px, 3vmin, 40px)/1.25 var(--f-texto); color: var(--texto-suave); text-wrap: balance; }
  .sub b { color: var(--texto); font-weight: 800; }
  .sub .marca { color: var(--rosa); }

  .contagem {
    align-self: flex-start;
    margin-top: 1.4vmin;
    display: inline-flex; align-items: baseline; gap: .6em;
    font: 700 clamp(14px, 2.2vmin, 30px)/1 var(--f-texto); color: var(--texto-suave);

  }
  .contagem strong { font: 800 1.6em/1 var(--f-titulo); color: var(--azul); font-variant-numeric: tabular-nums; }

    margin-top: 4vmin;
    display: grid; gap: .5em;
    border-left: 3px solid var(--azul);
    padding-left: 1.1em;
    min-height: 6.5em;

  .dica small { font: 800 clamp(10px, 1.3vmin, 17px)/1 var(--f-texto); letter-spacing: .16em; text-transform: uppercase; color: var(--azul); }

<main class="palco">
  <div class="texto">
    <span class="selo entra" style="animation-delay:.2s"><i></i>Ao vivo em breve</span>
    <h1 class="entra" id="titulo" style="animation-delay:.35s">Em instantes<span class="pontos"><span>.</span><span>.</span><span>.</span></span></h1>
    <p class="sub entra" style="animation-delay:.5s">A live do <b class="marca">eploc</b> já vai começar. <b>Pegue um café</b> e fique por aqui.</p>
    <div class="contagem entra" id="contagem" style="animation-delay:.65s" hidden>começa em <strong id="relogio">--:--</strong></div>
    <div class="dica entra" style="animation-delay:.8s">
      <small>Você sabia?</small>
      <p id="dica">Mais de 75 melhorias para o eproc, o SEI e o RUPE, cada uma ligada ou desligada com um clique.</p>
    </div>
  </div>
</main>

<footer class="rodape">
  <span class="marca">eploc</span>
  <span>eploc.com.br</span>
</footer>

const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// Perfil em gota: uma Bézier sai do bico apertado (no cursor) e chega tangente à esfera,
// formando os flancos côncavos da logo. Linhas: polo do bico + pescoço + calota da esfera.
const N_PESCOCO = 42, N_ESFERA = LINHAS - 1 - N_PESCOCO;
const perfilY = new Float32Array(LINHAS), perfilR = new Float32Array(LINHAS), perfilPesc = new Float32Array(LINHAS);
function moldarBola(R, L, tempo, oscila, curva) {
  const h = L + R, rBico = 0.03 + 0.012 * Math.min(R / R_MAX, 1);
  const th0 = 1.05;                                   // ângulo (a partir do polo de baixo) onde o pescoço toca a esfera
  const y1 = h - R * Math.cos(th0), r1 = R * Math.sin(th0);
  const ty = Math.sin(th0), tr = Math.cos(th0);
  const P0y = 0, P0r = rBico;
  const P1y = 0.5 * y1, P1r = rBico + 0.5 * y1 * 0.05;
  const P2y = y1 - 0.42 * R * ty, P2r = r1 - 0.42 * R * tr;
  // polo do bico
  perfilY[0] = -0.01; perfilR[0] = 0; perfilPesc[0] = 1;
  for (let k = 0; k < N_PESCOCO; k++) {
    const u = Math.pow(k / N_PESCOCO, 1.35), v = 1 - u;
    const a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    perfilY[1 + k] = a * P0y + b * P1y + c * P2y + d * y1;
    perfilR[1 + k] = a * P0r + b * P1r + c * P2r + d * r1
      + 0.02 * Math.exp(-Math.pow(perfilY[1 + k] / 0.05, 2));   // beiço discreto onde a goma sai
    perfilPesc[1 + k] = 1 - u;
  }
  for (let k = 0; k < N_ESFERA; k++) {
    const th = th0 + (Math.PI - th0) * (k / (N_ESFERA - 1));
    perfilY[1 + N_PESCOCO + k] = h - R * Math.cos(th);
    perfilR[1 + N_PESCOCO + k] = k === N_ESFERA - 1 ? 0 : R * Math.sin(th);
    perfilPesc[1 + N_PESCOCO + k] = 0;
  }
  let p = 0;
  for (let i = 0; i < LINHAS; i++) {
    const y = perfilY[i], r = perfilR[i], pesc = perfilPesc[i];
    const desvio = curva * Math.sin(Math.PI * pesc) * pesc;   // leve curva no bico
    const pesoOnda = 1 - pesc;
    // vincos da goma esticada, que convergem para o bico
    const pesoVinco = 0.22 * Math.pow(pesc, 1.4) * smooth(0, 0.06, y);
    for (let j = 0; j <= SEG; j++) {
      const phi = Math.PI + (j / SEG) * Math.PI * 2;
      const onda = 1 + oscila * pesoOnda * (
        0.55 * Math.sin(3 * phi + tempo * 2.3 + y * 1.7) +
        0.45 * Math.sin(2 * phi - tempo * 1.6 + y * 2.9))
        + pesoVinco * (0.65 * Math.sin(5 * phi + pesc * 1.8) + 0.35 * Math.sin(3 * phi - pesc * 2.6 + 1.3));

      posBola[p++] = rr * Math.sin(phi) + desvio;
      posBola[p++] = y;
      posBola[p++] = rr * Math.cos(phi);
    }

  geoBola.computeVertexNormals();
  geoBola.computeBoundingSphere();

function caminhoE() {

const matE = new THREE.SpriteMaterial({ map: texturaE(), transparent: true, depthWrite: false, depthTest: false, toneMapped: false });
const spriteE = new THREE.Sprite(matE);
spriteE.renderOrder = 2;
logo.add(spriteE);

/* Brilho suave atrás da bola */
function texturaBrilho(cor) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, cor); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const brilho = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturaBrilho("rgba(255,90,160,0.55)"), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
brilho.position.set(CENTRO.x, CENTRO.y, -1.2);
logo.add(brilho);

/* ---------- Anel azul ---------- */
const R_ANEL = 1.9;
const matAnel = new THREE.MeshPhysicalMaterial({ color: 0x86c3ef, emissive: 0x1c4f80, emissiveIntensity: .45, roughness: .25, clearcoat: 1, clearcoatRoughness: .1 });
const anel = new THREE.Mesh(new THREE.BufferGeometry(), matAnel);
const suporteAnel = new THREE.Group();
suporteAnel.position.copy(CENTRO);
suporteAnel.position.z = -0.4;   // atrás do bico, como na logo
suporteAnel.add(anel);
logo.add(suporteAnel);
let arcoAtual = -1;
function desenharAnel(frac) {
  const arco = Math.max(0.0001, Math.min(frac, 1)) * Math.PI * 2;
  if (Math.abs(arco - arcoAtual) < 1e-4) return;
  arcoAtual = arco;
  anel.geometry.dispose();
  anel.geometry = new THREE.TorusGeometry(R_ANEL, 0.058, 20, Math.max(8, Math.round(160 * frac)), arco);
  anel.rotation.z = Math.PI * 1.25 - arco;  // começa atrás do pescoço e fecha no sentido horário
}

/* ---------- Cursor (seta do mouse) ---------- */
function formaCursor(escala) {
  const pts = [[0,0],[0,16],[4,12.2],[7,18.6],[9.6,17.5],[6.7,11.3],[12,11.3]];
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => i ? s.lineTo(x * escala, -y * escala) : s.moveTo(x * escala, -y * escala));
  s.closePath();
  return s;
}
const cursor = new THREE.Group();
{
  const esc = 0.044;
  const geoMiolo = new THREE.ExtrudeGeometry(formaCursor(esc), { depth: 0.08, bevelEnabled: true, bevelThickness: .03, bevelSize: .01, bevelSegments: 3 });
  const geoContorno = new THREE.ExtrudeGeometry(formaCursor(esc), { depth: 0.06, bevelEnabled: true, bevelThickness: .03, bevelSize: .075, bevelSegments: 3 });
  const miolo = new THREE.Mesh(geoMiolo, new THREE.MeshPhysicalMaterial({ color: 0xffd3e5, emissive: 0x5a1030, emissiveIntensity: .15, roughness: .3, clearcoat: 1 }));
  const contorno = new THREE.Mesh(geoContorno, new THREE.MeshPhysicalMaterial({ color: 0xd42a6c, emissive: 0x4a0520, emissiveIntensity: .5, roughness: .3, clearcoat: 1 }));
  miolo.position.z = 0.04; contorno.position.z = -0.04;
  const seta = new THREE.Group(); seta.add(contorno, miolo);
  // gira para a cauda ficar oposta à bola (ponta encostada no pescoço)
  const eixo = Math.atan2(-14.5, 6.5);
  seta.rotation.z = Math.atan2(-DIR.y, -DIR.x) - eixo;
  seta.position.set(DIR.x * 0.06, DIR.y * 0.06, -0.02);  // ponta enfiada sob o bico
  cursor.add(seta);
}
logo.add(cursor);

/* Onda do clique */
const onda = new THREE.Mesh(new THREE.TorusGeometry(1, 0.025, 8, 64), new THREE.MeshBasicMaterial({ color: 0xffb3d1, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
onda.position.copy(PONTA); onda.position.z = 0.1;
logo.add(onda);

/* ---------- Estouro: lascas de chiclete ---------- */
const N_LASCAS = 180;
const lascas = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), matChiclete, N_LASCAS);
lascas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lascas.frustumCulled = false;
logo.add(lascas);
const dadosLascas = Array.from({ length: N_LASCAS }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3(), s: 0, vida: 0 }));
const choque = new THREE.Mesh(new THREE.RingGeometry(0.96, 1, 96), new THREE.MeshBasicMaterial({ color: 0xffd0e2, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
logo.add(choque);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _e = new THREE.Euler();
let lascasVivas = false;

function estourar(centro, R, forca = 1) {
  for (const d of dadosLascas) {
    const dirx = new THREE.Vector3().randomDirection();
    d.p.copy(centro).addScaledVector(dirx, R * (0.85 + Math.random() * .15));
    d.v.copy(dirx).multiplyScalar((3 + Math.random() * 4.5) * forca);
    d.v.z *= 0.5;
    d.q.setFromEuler(_e.set(Math.random() * 6, Math.random() * 6, Math.random() * 6));
    d.w.set(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(12);
    d.s = (0.05 + Math.random() * 0.13) * Math.sqrt(R / R_MAX + .2);
    d.vida = 1;
  }
  lascasVivas = true;
  choque.position.set(centro.x, centro.y, centro.z + .2);
  choque.userData.t = 0; choque.userData.R = R;
  empurrarBolhas(centro, 4 * forca);
}
function atualizarLascas(dt) {
  if (!lascasVivas) { lascas.count = 0; return; }
  let vivas = 0;
  for (let i = 0; i < N_LASCAS; i++) {
    const d = dadosLascas[i];
    if (d.vida > 0) {
      d.vida -= dt * 0.7;
      d.v.y -= 6.5 * dt; d.v.multiplyScalar(1 - 1.4 * dt);
      d.p.addScaledVector(d.v, dt);
      _q.setFromEuler(_e.set(d.w.x * dt, d.w.y * dt, d.w.z * dt)); d.q.multiply(_q);
      const k = Math.max(d.vida, 0);
      _s.set(d.s * k, d.s * k, d.s * k * 0.35);
      _m.compose(d.p, d.q, _s);
      lascas.setMatrixAt(vivas++, _m);
    }
  }
  lascas.count = vivas;
  lascas.instanceMatrix.needsUpdate = true;
  if (!vivas) lascasVivas = false;
  if (choque.userData.t !== undefined && choque.userData.t < 1) {
    choque.userData.t += dt * 2.2;
    const t = choque.userData.t;
    choque.scale.setScalar(choque.userData.R * (1 + t * 1.6));
    choque.material.opacity = Math.max(0, 0.8 * (1 - t));
  }
}

/* ---------- Bolhas de fundo ---------- */
const N_BOLHAS = 46;
const matBolhas = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .15, clearcoat: 1, transparent: true, opacity: .34, iridescence: .8, depthWrite: false });
const bolhas = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 24, 16), matBolhas, N_BOLHAS);
bolhas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bolhas.frustumCulled = false;
const paleta = [0xff7fb2, 0xff9cc4, 0x8cc6f2, 0xb8dcf7, 0xffffff];
const dadosBolhas = Array.from({ length: N_BOLHAS }, (_, i) => {
  bolhas.setColorAt(i, new THREE.Color(paleta[i % paleta.length]));
  return { x: (Math.random() - .5) * 26, y: (Math.random() - .5) * 16, z: -3 - Math.random() * 12, r: .08 + Math.random() * .32, vel: .25 + Math.random() * .45, fase: Math.random() * 6.28, ex: 0, ey: 0 };
});
cena.add(bolhas);
function empurrarBolhas(centro, forca) {
  const c = centro.clone(); logo.localToWorld(c);
  for (const b of dadosBolhas) {
    const dx = b.x - c.x, dy = b.y - c.y, dist = Math.hypot(dx, dy) + 1;
    b.ex += dx / dist * forca / dist * 3; b.ey += dy / dist * forca / dist * 3;
  }
}
function atualizarBolhas(t, dt) {
  for (let i = 0; i < N_BOLHAS; i++) {
    const b = dadosBolhas[i];
    b.y += b.vel * dt * (reduzido ? .3 : 1);
    b.x += b.ex * dt; b.y += b.ey * dt;
    b.ex *= 1 - 1.6 * dt; b.ey *= 1 - 1.6 * dt;
    if (b.y > 9) { b.y = -9; b.x = (Math.random() - .5) * 26; }
    _m.compose(_s.set(b.x + Math.sin(t * .6 + b.fase) * .4, b.y, b.z), _q.identity(), new THREE.Vector3(b.r, b.r, b.r));
    bolhas.setMatrixAt(i, _m);
  }
  bolhas.instanceMatrix.needsUpdate = true;
}

/* ---------- Linha do tempo ---------- */
// Introdução: cursor entra até o centro do aro (0-1.6s). Depois um ciclo de 22s: clique no centro,
// encher (o cursor recua na diagonal puxando o bico, e a bola cresce parada no centro do aro),
// ficar, inchar demais, estourar, cursor volta ao centro e sopra de novo.
const T_INTRO = 1.6, CICLO = 22;
const F = { clique: 0, encherIni: 0.3, encherFim: 2.3, incharIni: 18.2, estouro: 19.1, voltaIni: 20.2, voltaFim: 21.5, fim: CICLO };
const H_MIN = 0.08;                                         // distância ponta-centro com a bola vazia
const PONTA_INICIAL = new THREE.Vector3(CENTRO.x - DIR.x * H_MIN, CENTRO.y - DIR.y * H_MIN, 0);
const pontaAtual = new THREE.Vector3().copy(PONTA_INICIAL);
const pontaNoEstouro = new THREE.Vector3().copy(PONTA);
const easeOutBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

let cicloAtual = -1, estourouNoCiclo = false, anelPronto = false;
let finalAtivo = false, estouroGrande = false;
let inicioOffset = 0;

const centroAtual = new THREE.Vector3();
function cenaNoTempo(t, dt) {
  // cursor entrando até o centro do aro
  const kIn = easeInOut(Math.min(t / T_INTRO, 1));
  const desde = new THREE.Vector3(PONTA.x - 6, PONTA.y - 4, 2);
  cursor.position.lerpVectors(desde, PONTA_INICIAL, kIn);
  cursor.position.x += Math.sin(kIn * Math.PI) * 1.2;

  if (t < T_INTRO) { bola.visible = false; spriteE.visible = false; desenharAnel(0); anel.visible = false; return; }

  let tc = t - T_INTRO;
  let ciclo = Math.floor(tc / CICLO);
  tc -= ciclo * CICLO;
  if (ciclo !== cicloAtual) { cicloAtual = ciclo; estourouNoCiclo = false; }

  // clique
  const kClique = tc < 0.35 ? Math.sin(tc / 0.35 * Math.PI) : 0;
  cursor.scale.setScalar(1 - kClique * 0.14);
  cursor.position.z = -kClique * .25;
  onda.material.opacity = tc < 0.9 ? 0.9 * (1 - tc / 0.9) : 0;
  onda.scale.setScalar(0.1 + tc * 1.2);

  // enchimento
  // sopro de ~2s: começa devagar, ganha ritmo, com leves pulsos de fôlego; no fim, uma pequena acomodação
  const kSopro = Math.min(Math.max((tc - F.encherIni) / (F.encherFim - F.encherIni), 0), 1);
  let encher = tc < F.encherIni ? 0
    : easeInOut(kSopro) * 0.94 + kSopro * 0.06 + 0.025 * Math.sin(kSopro * Math.PI * 5) * Math.sin(kSopro * Math.PI);
  if (tc > F.encherFim && !reduzido) {
    const dtA = tc - F.encherFim;
    encher = 1 + 0.045 * Math.exp(-dtA * 4.5) * Math.sin(dtA * 13);
  }
  if (reduzido) encher = smooth(F.encherIni, F.encherFim, tc);
  const respira = 1 + Math.sin(t * 1.7) * 0.018;
  let inchar = 0;
  if (tc > F.incharIni && tc < F.estouro) inchar = Math.pow((tc - F.incharIni) / (F.estouro - F.incharIni), 2);
  const visivel = tc < F.estouro;

  const crescimento = Math.max(encher, 0);
  let R = Math.max(0.02, R_MAX * crescimento * respira * (1 + inchar * 0.22));
  const L = H_MIN + 0.7 * R_MAX * Math.min(crescimento, 1.05);

  // ponta do cursor: recua do centro do aro na mesma medida em que a bola cresce,
  // então a bola enche parada no centro; depois do estouro, volta ao centro para soprar de novo
  if (tc < F.estouro) {
    pontaAtual.set(CENTRO.x - DIR.x * (L + R_MAX * crescimento), CENTRO.y - DIR.y * (L + R_MAX * crescimento), 0);
    pontaNoEstouro.copy(pontaAtual);
  } else {
    const kV = easeInOut(smooth(F.voltaIni, F.voltaFim, tc));
    pontaAtual.lerpVectors(pontaNoEstouro, PONTA_INICIAL, kV);
    pontaAtual.x += Math.sin(kV * Math.PI) * 0.35;        // volta num arco, não em linha reta
    pontaAtual.y -= Math.sin(kV * Math.PI) * 0.35;
  }
  cursor.position.x = pontaAtual.x; cursor.position.y = pontaAtual.y;
  suporteBola.position.set(pontaAtual.x, pontaAtual.y, 0);
  onda.position.set(pontaAtual.x, pontaAtual.y, 0.1);
  const tremor = inchar > 0 ? Math.sin(t * 60) * inchar * 0.015 : 0;
  const oscila = (reduzido ? .006 : .014) + (1 - Math.min(tc / 3.4, 1)) * 0.05 + inchar * 0.05;
  moldarBola(R * (1 + tremor), L, t, oscila, 0.07 + Math.sin(t * .9) * .025);
  bola.visible = visivel && crescimento > 0.001;

  // centro da bola no grupo
  const h = L + R;
  centroAtual.set(pontaAtual.x + DIR.x * h, pontaAtual.y + DIR.y * h, 0);

  // "e"
  const kE = smooth(0.45, 0.85, crescimento);
  spriteE.visible = bola.visible && kE > 0;
  spriteE.position.set(centroAtual.x - R * .06, centroAtual.y - R * .02, R * 1.02);
  spriteE.scale.setScalar(R * 1.55 * (0.6 + 0.4 * kE));
  matE.opacity = kE;
  matE.rotation = Math.sin(t * 1.3) * 0.04;

  brilho.position.set(centroAtual.x, centroAtual.y, -1.2);
  brilho.scale.setScalar(R * 4.2 + 0.3);
  brilho.material.opacity = visivel ? 0.9 : Math.max(0, 0.9 - (tc - F.estouro) * 2);

  // anel: desenha uma vez na primeira bola
  if (!anelPronto) {
    const kA = smooth(1.0, 2.8, tc);
    anel.visible = kA > 0;
    desenharAnel(easeInOut(kA));
    if (kA >= 1) anelPronto = true;
  }
  const pulsoAnel = tc > F.estouro ? Math.exp(-(tc - F.estouro) * 4) * Math.sin((tc - F.estouro) * 30) * 0.05 : 0;
  suporteAnel.scale.setScalar(1 + pulsoAnel + inchar * 0.03);
  suporteAnel.rotation.x = Math.sin(t * .45) * .2;
  suporteAnel.rotation.y = Math.cos(t * .37) * .18;

  if (!estourouNoCiclo && tc >= F.estouro && !reduzido) {
    estourouNoCiclo = true;
    estourar(centroAtual, estouroGrande ? R * 1.1 : R, estouroGrande ? 1.8 : 1);
    estouroGrande = false;
  }
  if (reduzido && tc >= F.estouro) bola.visible = false;
}

/* ---------- Final (Enter ou fim da contagem): estouro grande e título muda ---------- */
// O título muda uma vez. A bola, se estiver no ar, estoura na hora com mais força: o ciclo é
// adiantado até o estouro e segue normalmente (o cursor volta ao centro e sopra outra).
function disparaFinal() {
  if (!finalAtivo) {
    finalAtivo = true;
    const h1 = document.getElementById("titulo");
    h1.innerHTML = 'Começando!';
    h1.classList.remove("entra"); void h1.offsetWidth; h1.classList.add("entra");
    document.querySelector(".selo").lastChild.textContent = "Ao vivo";
  }
  const tl = t - inicioOffset - T_INTRO;
  if (tl < 0 || !bola.visible) return;
  const tc = ((tl % CICLO) + CICLO) % CICLO;
  if (tc < F.estouro) { inicioOffset -= F.estouro - tc; estouroGrande = true; }
}

/* ---------- Layout responsivo da cena ---------- */
function ajustar() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const altVis = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  const largVis = altVis * camera.aspect;
  const largo = w / h > 1.25;
  const escala = largo ? Math.min(altVis / 6.4, largVis * 0.5 / 5.6) : Math.min(largVis / 6.2, altVis * 0.52 / 5.8);
  logo.scale.setScalar(escala);
  if (largo) logo.position.set(-largVis * 0.25 + 0.3, 0.1, 0);
  else logo.position.set(0, altVis * 0.21, 0);
}
addEventListener("resize", ajustar);
ajustar();

/* ---------- Laço ---------- */
const relogio = new THREE.Clock();
let t = Number(qs.get("t")) || 0;   // ?t=20 pula para um ponto da animação (útil para testar)
function quadro() {
  const dt = Math.min(relogio.getDelta(), 1 / 20);
  t += dt;
  cenaNoTempo(t - inicioOffset, dt);
  atualizarLascas(dt);
  atualizarBolhas(t, dt);
  // leve deriva da câmera para dar profundidade
  camera.position.x = Math.sin(t * .17) * .6;
  camera.position.y = Math.cos(t * .13) * .35;
  camera.lookAt(0, 0, 0);
  logo.rotation.y = Math.sin(t * .25) * .12;
  logo.rotation.x = Math.cos(t * .21) * .06;
  renderer.render(cena, camera);
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

/* ---------- Teclas: P estoura agora, Enter dispara o final ---------- */
addEventListener("keydown", e => {
  if (e.key === "Enter") disparaFinal();
  if ((e.key === "p" || e.key === "P") && bola.visible) {
    // adianta o ciclo até o início do "inchar demais"
    const tl = t - inicioOffset - T_INTRO;
    const tc = ((tl % CICLO) + CICLO) % CICLO;
    if (tc > F.encherFim && tc < F.incharIni) inicioOffset -= F.incharIni - tc;
  }
});

/* ---------- Contagem regressiva ---------- */
if (inicioTxt) {
  const [hh, mm] = inicioTxt.split(":").map(Number);
  const alvo = new Date(); alvo.setHours(hh, mm || 0, 0, 0);
  const caixa = document.getElementById("contagem"), rel = document.getElementById("relogio");
  caixa.hidden = false;
  const tick = () => {
    const falta = Math.round((alvo - Date.now()) / 1000);
    if (falta <= 0) { rel.textContent = "00:00"; disparaFinal(); caixa.hidden = true; return; }
    const m = Math.floor(falta / 60), s = falta % 60;
    rel.textContent = m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    setTimeout(tick, 250);
  };
  tick();
}
