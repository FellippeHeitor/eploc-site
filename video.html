<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo — eploc</title>
    <meta name="robots" content="noindex">
    <style>
        html, body { margin: 0; height: 100%; background: #000; }
        iframe { display: block; width: 100%; height: 100%; border: 0; }
        .empty {
            display: flex; align-items: center; justify-content: center; height: 100%;
            padding: 16px; box-sizing: border-box; text-align: center;
            color: #fff; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
    </style>
</head>
<body>
    <script>
        // Casca https para embeds do YouTube usados de dentro da extensão eploc:
        // paginas chrome-extension:// nao enviam o header Referer, que o player
        // do YouTube exige para se configurar (sem ele, "Erro 153"). Esta pagina
        // e https de verdade, entao o Referer vai e o embed funciona; a extensao
        // aponta seu iframe pra ca em vez de direto pro youtube.com.
        var params = new URLSearchParams(location.search);
        var id = params.get("v");
        var start = params.get("t");

        if (id && /^[\w-]{6,}$/.test(id)) {
            var src = "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?rel=0";
            if (start) src += "&start=" + encodeURIComponent(start);

            var iframe = document.createElement("iframe");
            iframe.src = src;
            iframe.title = "Vídeo de demonstração";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.allowFullscreen = true;
            document.body.appendChild(iframe);
        } else {
            document.body.innerHTML = '<div class="empty">Vídeo não encontrado.</div>';
        }
    </script>
</body>
</html>
